name: Web

on:
  push:
    branches: [main]
    paths:
      - 'saas-onboarding-web/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'saas-onboarding-web/**'
      - '.github/workflows/web.yml'

defaults:
  run:
    working-directory: saas-onboarding-web

jobs:
  test:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: saas-onboarding-web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test -- --ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: saas-onboarding-web
          push: false
          tags: saas-onboarding-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
