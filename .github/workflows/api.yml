name: API

on:
  push:
    branches: [main]
    paths:
      - 'saas-onboarding-api/**'
      - '.github/workflows/api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'saas-onboarding-api/**'
      - '.github/workflows/api.yml'

defaults:
  run:
    working-directory: saas-onboarding-api

jobs:
  test:
    name: Lint and test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saas_test
          POSTGRES_PASSWORD: saas_test
          POSTGRES_DB: saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: saas_test
      DB_USERNAME: saas_test
      DB_PASSWORD: saas_test

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_pgsql, intl, bcmath, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Run migrations against PostgreSQL
        run: php artisan migrate --force

      - name: Run tests against PostgreSQL
        run: php artisan test

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas-onboarding-api/infrastructure/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - name: Validate (no AWS credentials or state backend needed)
        run: |
          terraform init -backend=false
          terraform validate

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: saas-onboarding-api
          push: false
          tags: saas-onboarding-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
