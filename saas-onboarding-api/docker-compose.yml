# Local stack: API + PostgreSQL + Redis.
#   docker compose up --build
# API:  http://localhost:8000/api/health
# Demo login: demo@example.com / password

services:
  app:
    build: .
    container_name: saas-onboarding-api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "SaaS Onboarding API"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: saas_platform
      DB_USERNAME: saas_user
      DB_PASSWORD: saas_password
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      EVENT_DRIVER: log
      SEED_DEMO_DATA: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: saas-postgres
    environment:
      POSTGRES_DB: saas_platform
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_user -d saas_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: saas-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data:
